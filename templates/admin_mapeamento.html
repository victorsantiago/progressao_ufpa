{% extends "base.html" %}
{% block title %}Gestão · Mapeamento{% endblock %}
{% block content %}
<form method="post">
  <div class="tabela-topo sticky-save">
    <button class="btn primary" type="submit">Salvar mapeamento</button>
    <div class="actions">
      <input type="search" id="busca" placeholder="Filtrar itens do Lattes…" class="busca">
      <button class="btn" type="submit" name="acao" value="restaurar" onclick="return confirm('Restaurar o mapeamento padrão?')">Restaurar padrão</button>
    </div>
  </div>
  <div class="box">
    <table class="tabela">
      <thead><tr><th style="width:42%">Item do Lattes</th><th>Item da tabela</th></tr></thead>
      <tbody>
      {% for c in cats %}
        <tr class="map-row" data-busca="{{ c.label|lower }}">
          <td>{{ c.label }}</td>
          <td>
            <select name="map__{{ c.key }}" class="sel {{ 'sem-item' if not c.atual }}">
              <option value="">— não pontua —</option>
              {% for g, nome in GRUPOS.items() %}
              <optgroup label="Grupo {{ g }} — {{ nome }}">
                {% for it in itens if it.grupo == g %}
                <option value="{{ it.key }}" {{ 'selected' if it.key == c.atual }}>{{ it.codigo }} — {{ it.atividade[:120] }}{{ '…' if it.atividade|length > 120 }}</option>
                {% endfor %}
              </optgroup>
              {% endfor %}
            </select>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('busca').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.map-row').forEach(r => r.style.display = !q || r.dataset.busca.includes(q) ? '' : 'none');
});
document.querySelectorAll('select.sel').forEach(s => s.addEventListener('change', () => s.classList.toggle('sem-item', !s.value)));
</script>
{% endblock %}
